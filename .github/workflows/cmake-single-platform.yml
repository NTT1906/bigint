name: CMake Multi-Compiler CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  BUILD_TYPE: Release

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux GCC
          - name: Linux GCC
            os: ubuntu-latest
            compiler: gcc
            cc: gcc
            cxx: g++

          # Linux Clang
          - name: Linux Clang
            os: ubuntu-latest
            compiler: clang
            cc: clang
            cxx: clang++

          # Windows MSVC
          - name: Windows MSVC
            os: windows-latest
            compiler: msvc

          # Windows GCC (MinGW/MSYS2)
          - name: Windows GCC
            os: windows-latest
            compiler: mingw
            cc: gcc
            cxx: g++

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '4.0.0'

      # ----------------------------
      # MSYS2 (Windows GCC)
      # ----------------------------
      - name: Setup MSYS2
        if: matrix.compiler == 'mingw'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          cache: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      # ----------------------------
      # Verify compiler
      # ----------------------------
      - name: Verify compiler
        if: matrix.compiler != 'msvc'
        shell: bash
        run: |
          cmake --version
          ${{ matrix.cc }} --version
          ${{ matrix.cxx }} --version

      # ----------------------------
      # Set CC/CXX (Linux + MinGW)
      # ----------------------------
      - name: Configure environment
        if: matrix.compiler != 'msvc'
        shell: bash
        run: |
          echo "CC=${{ matrix.cc }}" >> $GITHUB_ENV
          echo "CXX=${{ matrix.cxx }}" >> $GITHUB_ENV

      # ----------------------------
      # Configure (Linux + MSVC)
      # ----------------------------
      - name: Configure CMake (Normal)
        if: matrix.compiler != 'mingw'
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      # ----------------------------
      # Configure (MinGW)
      # ----------------------------
      - name: Configure CMake (MinGW)
        if: matrix.compiler == 'mingw'
        shell: msys2 {0}
        run: >
          cmake -B build
          -G Ninja
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      # ----------------------------
      # Build (Linux + MSVC)
      # ----------------------------
      - name: Build (Normal)
        if: matrix.compiler != 'mingw'
        run: >
          cmake --build build
          --config ${{ env.BUILD_TYPE }}

      # ----------------------------
      # Build (MinGW)
      # ----------------------------
      - name: Build (MinGW)
        if: matrix.compiler == 'mingw'
        shell: msys2 {0}
        run: >
          cmake --build build

      # ----------------------------
      # Test (Linux + MSVC)
      # ----------------------------
      - name: Test (Normal)
        if: matrix.compiler != 'mingw'
        working-directory: build
        run: >
          ctest
          -C ${{ env.BUILD_TYPE }}
          --output-on-failure

      # ----------------------------
      # Test (MinGW)
      # ----------------------------
      - name: Test (MinGW)
        if: matrix.compiler == 'mingw'
        shell: msys2 {0}
        working-directory: build
        run: >
          ctest
          --output-on-failure