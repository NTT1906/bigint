name: CMake Multi-Compiler CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  BUILD_TYPE: Release

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux GCC
          - name: Linux GCC
            os: ubuntu-latest
            compiler: gcc
            cc: gcc
            cxx: g++

          # Linux Clang
          - name: Linux Clang
            os: ubuntu-latest
            compiler: clang
            cc: clang
            cxx: clang++

          # Windows MSVC
          - name: Windows MSVC
            os: windows-latest
            compiler: msvc

          # Windows GCC (MinGW/MSYS2)
          - name: Windows GCC
            os: windows-latest
            compiler: mingw
            cc: gcc
            cxx: g++

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install CMake 4
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '4.0.0'

      # Setup MSYS2 + MinGW GCC on Windows
      - name: Setup MSYS2
        if: matrix.compiler == 'mingw'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Verify compiler
        shell: bash
        run: |
          cmake --version

          if [ "${{ matrix.compiler }}" = "mingw" ] || \
             [ "${{ matrix.compiler }}" = "gcc" ] || \
             [ "${{ matrix.compiler }}" = "clang" ]; then
            ${{ matrix.cc }} --version
            ${{ matrix.cxx }} --version
          fi

      # Configure GCC/Clang environment
      - name: Configure environment
        if: matrix.compiler != 'msvc'
        shell: bash
        run: |
          echo "CC=${{ matrix.cc }}" >> $GITHUB_ENV
          echo "CXX=${{ matrix.cxx }}" >> $GITHUB_ENV

      # Configure
      - name: Configure CMake
        shell: ${{ matrix.compiler == 'mingw' && 'msys2 {0}' || 'bash' }}
        run: >
          cmake -B build
          -G Ninja
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      # Build
      - name: Build
        shell: ${{ matrix.compiler == 'mingw' && 'msys2 {0}' || 'bash' }}
        run: >
          cmake --build build
          --config ${{ env.BUILD_TYPE }}

      # Test
      - name: Test
        shell: ${{ matrix.compiler == 'mingw' && 'msys2 {0}' || 'bash' }}
        working-directory: build
        run: >
          ctest
          -C ${{ env.BUILD_TYPE }}
          --output-on-failure