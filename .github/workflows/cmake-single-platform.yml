name: CMake Multi-Compiler CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  BUILD_TYPE: Release

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux GCC
          - name: Linux GCC
            os: ubuntu-latest
            compiler: gcc
            cc: gcc
            cxx: g++

          # Linux Clang
          - name: Linux Clang
            os: ubuntu-latest
            compiler: clang
            cc: clang
            cxx: clang++

          # Windows MSVC
          - name: Windows MSVC
            os: windows-latest
            compiler: msvc

          # Windows GCC (MinGW)
          - name: Windows GCC
            os: windows-latest
            compiler: mingw
            cc: gcc
            cxx: g++

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install CMake 4
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '4.0.0'

      # Install MinGW for Windows GCC builds
      - name: Setup MinGW
        if: matrix.compiler == 'mingw'
        uses: egor-tensin/setup-mingw@v2
        with:
          platform: x64

      - name: Verify compiler
        shell: bash
        run: |
          cmake --version
          
          if [ "${{ matrix.compiler }}" = "mingw" ] || \
             [ "${{ matrix.compiler }}" = "gcc" ] || \
             [ "${{ matrix.compiler }}" = "clang" ]; then
            ${{ matrix.cc }} --version
            ${{ matrix.cxx }} --version
          fi

      # Configure GCC/Clang/MinGW compilers
      - name: Configure environment
        if: matrix.compiler != 'msvc'
        shell: bash
        run: |
          echo "CC=${{ matrix.cc }}" >> $GITHUB_ENV
          echo "CXX=${{ matrix.cxx }}" >> $GITHUB_ENV

      # MSVC uses default Visual Studio generator
      - name: Configure CMake
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Build
        run: >
          cmake --build build
          --config ${{ env.BUILD_TYPE }}

      - name: Test
        working-directory: build
        run: >
          ctest
          -C ${{ env.BUILD_TYPE }}
          --output-on-failure